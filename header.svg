    <text x="64" y="308" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.8" fill="#E9D7B3">DISEÑO CON INTENCIÓN  ·  CÓDIGO CON PROPÓSITO</text>
    <text x="1139" y="308" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.1" fill="#D6B585">@PXADANNY</text>
