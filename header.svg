<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Xadanny Pérez — Software Developer</title>
  <desc id="desc">Encabezado editorial en borgoña, crema y dorado, con monograma XP y líneas orbitales.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#310009"/>
      <stop offset="0.56" stop-color="#3B010B"/>
      <stop offset="1" stop-color="#601629"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2E5C6"/>
      <stop offset="0.50" stop-color="#D6B585"/>
      <stop offset="1" stop-color="#B58C4F"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="40%" r="70%">
      <stop offset="0" stop-color="#75162D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#75162D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rounded"><rect width="1200" height="340" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="340" fill="url(#back)"/>
    <rect x="660" y="-80" width="600" height="510" fill="url(#glow)"/>
    <g fill="none" stroke="#B58C4F" stroke-opacity="0.22">
      <path d="M-30 295 Q360 105 685 370"/>
      <path d="M730 -72 Q880 120 1250 54"/>
      <path d="M740 360 Q1060 250 1290 365"/>
    </g>
    <rect x="17" y="17" width="1166" height="306" rx="6" fill="none" stroke="#B58C4F" stroke-opacity="0.50"/>
    <path d="M51 65 H1149" stroke="#B58C4F" stroke-opacity="0.40"/>
    <text x="64" y="47" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="3.3" fill="#D6B585">X / P</text>
    <text x="155" y="47" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2.1" fill="#F2E5C6" opacity="0.80">DESARROLLO + DISEÑO</text>
    <text x="1139" y="47" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#D6B585" text-anchor="end">PORTAFOLIO PERSONAL</text>

    <path d="M63 96 V258" stroke="url(#metal)" stroke-width="3"/>
    <text x="91" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="77" fill="#F2E5C6" letter-spacing="-1">Xadanny</text>
    <text x="91" y="224" font-family="Georgia, 'Times New Roman', serif" font-size="77" font-style="italic" fill="url(#metal)" letter-spacing="-1">Pérez</text>
    <text x="95" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="3.4" fill="#E9D7B3">SOFTWARE DEVELOPER</text>

    <path d="M780 98 V261" stroke="#B58C4F" stroke-opacity="0.45"/>

    <!-- Monograma original, inspirado en órbitas y geometría editorial. -->
    <g transform="translate(983 181)">
      <circle r="105" fill="#75162D" fill-opacity="0.22" stroke="#D6B585" stroke-opacity="0.60" stroke-width="1.25"/>
      <circle r="86" fill="none" stroke="#D6B585" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="2 7"/>
      <ellipse rx="128" ry="45" transform="rotate(-27)" fill="none" stroke="#D6B585" stroke-opacity="0.71" stroke-width="1.35"/>
      <ellipse rx="127" ry="46" transform="rotate(31)" fill="none" stroke="#B58C4F" stroke-opacity="0.33" stroke-width="1"/>
      <circle cx="-107" cy="52" r="4" fill="#F2E5C6"/>
      <circle cx="104" cy="-63" r="3.5" fill="#D6B585"/>
      <text x="0" y="23" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="-8" fill="#F2E5C6">XP</text>
      <path d="M0 -86 L3 -78 L11 -75 L3 -72 L0 -64 L-3 -72 L-11 -75 L-3 -78 Z" fill="#D6B585"/>
      <path d="M74 56 L76 62 L82 64 L76 66 L74 72 L72 66 L66 64 L72 62 Z" fill="#D6B585" opacity="0.9"/>
